services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37
    restart: unless-stopped
    ports:
      - "11480:8080"
      - "9091:9091"
    environment:
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY:-secr3t}"
      AUTHORIZATION_ADMIN_LIST_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DISK_USE_WARNING_THRESHOLD: 0.95
      DISK_USE_CRITICAL_THRESHOLD: 0.99
      ENABLE_MODULES: "text2vec-transformers"
      TRANSFORMERS_INFERENCE_API: "http://t2v-model:8080"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
      - transformers_cache:/root/.cache

  t2v-model:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9
    restart: unless-stopped
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      GPU_OVERLAMS: "1"
    ports:
      - "8082:8080"
    volumes:
      - transformers_cache:/root/.cache
    platform: linux/arm64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  weaviate_data:
  transformers_cache:
