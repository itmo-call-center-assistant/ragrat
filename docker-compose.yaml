services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.7
    restart: unless-stopped
    ports:
      - "11480:8080"
      - "9091:9091"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: $WEAVIATE_API_KEY
      AUTHENTICATION_APIKEY_USERS: "admin"
      AUTHORIZATION_ADMIN_LIST_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DISK_USE_WARNING_THRESHOLD: 0.95
      DISK_USE_CRITICAL_THRESHOLD: 0.99
      ENABLE_MODULES: "text2vec-transformers"
      TRANSFORMERS_INFERENCE_API: "http://t2v-model:8080"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
      - transformers_cache:/root/.cache

  t2v-model:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-sha-5bc4d88
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      MODEL_ID: deepvk/USER2-base
      GPU_OVERLAMS: "1"
    ports:
      - "8082:8080"
    volumes:
      - transformers_cache:/root/.cache
    platform: linux/arm64

  indexer:
    image: ghcr.io/vladimirklepov/ragrat/indexer:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WEAVIATE_URL: "http://weaviate:8080"
    depends_on:
      - weaviate

  worker:
    image: ghcr.io/vladimirklepov/ragrat/worker:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env

volumes:
  weaviate_data:
  transformers_cache:
