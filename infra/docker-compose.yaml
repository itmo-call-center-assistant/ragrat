services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # HTTP API & Web UI Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage:z
    restart: always

  indexer:
    image: ghcr.io/itmo-call-center-assistant/ragrat/indexer:workspace
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - transformers_cache:/root/.cache/huggingface
    environment:
      QDRANT_URL: "http://qdrant:6333"

  worker:
    image: ghcr.io/itmo-call-center-assistant/ragrat/worker:workspace
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - transformers_cache:/root/.cache/huggingface
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_MODEL=qwen3.5-35b-a3b
      - LLM_API_KEY
      - LLM_BASE_URL
  caddy:
    image: docker.io/caddy:2-alpine
    environment:
      - HOST
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  qdrant_storage:
  transformers_cache:
  fastembed_cache:
  caddy_data:
  caddy_config:
