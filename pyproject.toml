[project]
name = "ragrat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "fastrtc[vad]>=0.0.34",
    "hydra-core",
    "omegaconf",
    "pyannote-audio==4.0.0",
    "sentencepiece",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy>=2.4.4",
    "onnxruntime==1.25.*",
    "transformers==4.57.1",
    "accelerate>=1.13.0",
    "soundfile>=0.13.1",
    "sentence-transformers==4.*",
    "openai>=1.0.0",
    "podman-compose>=1.5.0",
    "chonkie>=1.6.8",
    "weaviate-client>=4.0.0",
    "httpx>=0.28.1",
    "python-frontmatter>=1.3.0",
    "click>=8.0.0",
]

[project.scripts]
upload-md = "demo_md_upload.main:upload"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4",
    "TID", "RET", "ARG", "S", "T20"
]
ignore = ["S101", "S311", "T201", "ARG001"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.15.12",
    "weaviate-cli>=3.4.1",
]
