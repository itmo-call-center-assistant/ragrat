[project]
name = "ragrat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.14.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ragrat-shared = { workspace = true }

[tool.uv]
package = true

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py312"
line-length = 100

[lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4",
    "TID", "RET", "ARG", "S", "T20"
]
ignore = ["S101", "S311", "T201", "ARG001"]

[dependency-groups]
dev = [
    "podman-compose>=1.6.0",
    "pre-commit>=4.3.0",
    "ruff>=0.15.12"
]
