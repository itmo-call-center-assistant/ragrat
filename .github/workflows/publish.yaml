name: Build and Push Containers

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  packages: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v4

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build indexer image
        id: build-indexer
        uses: redhat-actions/buildah-build@v2
        with:
          context: .
          tags: |
            latest
            ${{ github.sha }}
          image: ghcr.io/${{ github.repository }}/indexer
          containerfiles: |
            ./Dockerfile.indexer

      - name: Push indexer image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-indexer.outputs.image }}
          tags: ${{ steps.build-indexer.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build worker image
        id: build-worker
        uses: redhat-actions/buildah-build@v2
        with:
          context: .
          tags: |
            latest
            ${{ github.sha }}
          image: ghcr.io/${{ github.repository }}/worker
          containerfiles: |
            ./Dockerfile.worker

      - name: Push worker image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-worker.outputs.image }}
          tags: ${{ steps.build-worker.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
